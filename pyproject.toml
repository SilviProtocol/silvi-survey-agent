[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silvi-field-agent"
version = "0.1.0"
description = "Voice field-survey agent: an open wire contract, survey records, and journal replay."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]
# Server-side speech, optional: Pipecat ships the Muse Voice
# Transcribe service that field_agent.voice adapts.
voice = [
  "pipecat-ai>=1.14,<2",
]
# Local BioCLIP 2 fallback for species answers. Heavy (torch);
# nothing else in the package imports it.
species = [
  "open-clip-torch>=2.26",
  "torch>=2.2",
  "pillow>=10",
]

[project.scripts]
field-agent = "field_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/field_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
